<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:512px;height:512px;display:flex;align-items:center;justify-content:center;background:#fff}
  .ic{width:512px;height:512px;background:#1c2333;border-radius:104px;
      display:flex;flex-direction:column;justify-content:center;gap:40px;padding:0 74px}
  /* 三条：根、已声明的子节点、虚线的"仅契约"子节点 —— 产品最有辨识度的那个视觉 */
  .row{display:flex;align-items:center;gap:22px}
  .row.in{padding-left:62px}
  .sq{width:52px;height:52px;border-radius:13px;flex:0 0 auto}
  .bar{height:26px;border-radius:13px}
  .solid{background:#e8edf5}
  .accent{background:#4c9aff}
  .dashed{border:7px dashed #4c9aff;background:transparent}
  .barline{border:7px dashed #4c9aff;background:transparent;height:38px;border-radius:19px}
</style></head><body>
  <div class="ic">
    <div class="row">
      <div class="sq solid"></div>
      <div class="bar solid" style="width:206px"></div>
    </div>
    <div class="row in">
      <div class="sq accent"></div>
      <div class="bar accent" style="width:152px"></div>
    </div>
    <div class="row in">
      <div class="sq dashed"></div>
      <div class="barline" style="width:152px"></div>
    </div>
  </div>
</body></html>
